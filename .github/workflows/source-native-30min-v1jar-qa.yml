# Opt-in disposable source PWA + Native APK QA, independent of production.
name: Source Native 30-minute v1 JAR QA

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/source-native-30min-v1jar-qa.yml
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  native-quick-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_TEST_PASSWORD: '123456'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Start disposable original PWA and empty local D1
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund wrangler@4
          hash="$(printf '%s' "${SOURCE_TEST_PASSWORD}" | sha256sum | cut -d' ' -f1)"
          umask 077
          printf 'COAST_PASSWORD_HASH=%s\nCOAST_SESSION_SECRET=%s\nCOAST_PREVIEW_PASSWORD_HINT=%s\n' \
            "${hash}" "$(openssl rand -hex 32)" "${SOURCE_TEST_PASSWORD}" > .dev.vars
          mkdir -p "${RUNNER_TEMP}/coast-source-native-qa-db"
          ./node_modules/.bin/wrangler pages dev elementera-mcp/deploy-pages \
            --ip 127.0.0.1 --port 8788 --d1 COAST_CHAT_DB=source-native-qa \
            --persist-to "${RUNNER_TEMP}/coast-source-native-qa-db" --log-level warn \
            > "${RUNNER_TEMP}/coast-source-pages.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/source-pages.pid"
          for i in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:8788/login > /dev/null; then break; fi
            if ! kill -0 "$(cat "${RUNNER_TEMP}/source-pages.pid")" 2>/dev/null; then
              tail -n 50 "${RUNNER_TEMP}/coast-source-pages.log" >&2
              exit 1
            fi
            sleep 2
          done
          curl --silent --fail http://127.0.0.1:8788/login >/dev/null
      - name: Start a fresh Cloudflare Quick Tunnel
        shell: bash
        id: tunnel
        run: |
          set -euo pipefail
          curl -fL --retry 3 --max-time 150 -o "${RUNNER_TEMP}/cloudflared" \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x "${RUNNER_TEMP}/cloudflared"
          "${RUNNER_TEMP}/cloudflared" tunnel --url http://127.0.0.1:8788 \
            --loglevel info > "${RUNNER_TEMP}/source-tunnel.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/source-tunnel.pid"
          url=''
          for i in $(seq 1 80); do
            url="$(grep -Eo 'https://[a-zA-Z0-9-]+[.]trycloudflare[.]com' "${RUNNER_TEMP}/source-tunnel.log" | head -n 1 || true)"
            if [ -n "${url}" ]; then break; fi
            if ! kill -0 "$(cat "${RUNNER_TEMP}/source-tunnel.pid")" 2>/dev/null; then
              tail -n 50 "${RUNNER_TEMP}/source-tunnel.log" >&2
              exit 1
            fi
            sleep 2
          done
          test -n "${url}"
          echo "url=${url}" >> "${GITHUB_OUTPUT}"
      - name: Verify real demo password and D1-backed APIs
        shell: bash
        env:
          URL: ${{ steps.tunnel.outputs.url }}
        run: |
          set -euo pipefail
          cookie="${RUNNER_TEMP}/qa-cookie"
          authenticated=0
          for i in $(seq 1 35); do
            status="$(curl --silent --show-error -c "${cookie}" -o /dev/null --write-out '%{http_code}' \
              --max-time 15 --data-urlencode "password=${SOURCE_TEST_PASSWORD}" "${URL}/login" || true)"
            if [ "${status}" = '302' ]; then authenticated=1; break; fi
            sleep 3
          done
          test "${authenticated}" = 1
          for path in /api/calendar/entries /api/library/books; do
            status="$(curl --silent --show-error -b "${cookie}" -o /dev/null --write-out '%{http_code}' \
              --max-time 15 "${URL}${path}")"
            test "${status}" = 200
          done
          rm -f "${cookie}"
          echo "Real password 123456 and isolated calendar/library APIs verified."
      - name: Test and build source Native against this live tunnel
        working-directory: apps/android
        shell: bash
        env:
          URL: ${{ steps.tunnel.outputs.url }}
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace \
            -PCOAST_API_BASE_URL="${URL}" -PSOURCE_PREVIEW_PASSWORD_HINT="${SOURCE_TEST_PASSWORD}"
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "${apk}"
          tools="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          badging="$("${tools}/aapt" dump badging "${apk}")"
          package_line="$(printf '%s\n' "${badging}" | sed -n '1p')"
          [[ "${package_line}" == *"name='com.elementeracoast.source'"* ]]
          [[ "${package_line}" == *"versionCode='3'"* ]]
          [[ "${package_line}" == *"versionName='0.2.1-source'"* ]]
          [[ "${badging}" == *"sdkVersion:'26'"* ]]
          "$tools/apksigner" verify --verbose --print-certs --min-sdk-version 26 "$apk" \
            > "$RUNNER_TEMP/source-native-qa-signature.txt"
          grep -F 'Verified using v1 scheme (JAR signing): true' "$RUNNER_TEMP/source-native-qa-signature.txt"
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/source-native-qa-signature.txt"
          unzip -Z1 "$apk" > "$RUNNER_TEMP/source-native-qa-ziplist.txt"
          grep -F 'META-INF/' "$RUNNER_TEMP/source-native-qa-ziplist.txt" | grep -F '.RSA'
          grep -F 'META-INF/' "$RUNNER_TEMP/source-native-qa-ziplist.txt" | grep -F '.SF'
          echo 'Verified V1/JAR signing files and V2 signature before publishing.'
          mkdir -p source-qa
          cp "${apk}" source-qa/elementera-coast-source-v0.2.1-30min-qa.apk
          (cd source-qa && sha256sum elementera-coast-source-v0.2.1-30min-qa.apk > SHA256SUMS.txt)
      - name: Publish APK as GitHub prerelease assets
        working-directory: apps/android
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.tunnel.outputs.url }}
        run: |
          set -euo pipefail
          tag="source-native-v1jar-qa-${GITHUB_RUN_ID}"
          gh release create "${tag}" \
            source-qa/elementera-coast-source-v0.2.1-30min-qa.apk \
            source-qa/SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" \
            --title "Source Native 0.2.1-source · temporary phone QA" --prerelease \
            --notes "Disposable 30-minute Native/PWA test only. APK contains temporary backend ${URL} using password 123456 and fresh, synthetic-data-only D1. The tunnel will expire with this workflow; no production access or stable signing. Debug signature may differ from older source APKs."
          echo "### Source Native 30-minute QA ready" >> "${GITHUB_STEP_SUMMARY}"
          echo "PWA and APK backend: ${URL}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Password: 123456" >> "${GITHUB_STEP_SUMMARY}"
          echo "APK direct: https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/elementera-coast-source-v0.2.1-30min-qa.apk" >> "${GITHUB_STEP_SUMMARY}"
          echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}" >> "${GITHUB_STEP_SUMMARY}"
          echo "SHA-256: $(cut -d' ' -f1 source-qa/SHA256SUMS.txt)" >> "${GITHUB_STEP_SUMMARY}"
          echo "Backend will stop when this runner finishes; no data or production credentials survive." >> "${GITHUB_STEP_SUMMARY}"
      - name: Publish temporary test URL to commit status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.tunnel.outputs.url }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success -f context=source-native-30min-live \
            -f description="Temporary source Native + PWA; login 123456; expires after runner finishes" \
            -f target_url="${URL}" > /dev/null
      - name: Keep tunnel online for 30-minute phone acceptance
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            sleep 30
            kill -0 "$(cat "${RUNNER_TEMP}/source-tunnel.pid")"
            kill -0 "$(cat "${RUNNER_TEMP}/source-pages.pid")"
          done
          echo 'Temporary Native/PWA QA session ended. Runner and local database will be discarded.'
